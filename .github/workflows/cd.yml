name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: github.event_name == 'push'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # Registry-backed cache in a dedicated package, not type=gha: this
          # pipeline only runs on tag refs, and GHA cache entries written on a
          # tag are invisible to every other ref, so a gha cache can never hit
          # across releases (and would blow the 10 GB repo-wide cap anyway).
          # The buildcache package is wiped weekly by buildcache-cleanup.yml.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-buildcache:${{ env.PLATFORM_PAIR }},mode=max,compression=zstd

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # Untagged intermediate digests only — the build cache lives in the
      # separate herald-buildcache package and is cleaned by
      # buildcache-cleanup.yml, never here (deleting it per-release would
      # defeat the cache).
      - name: Clean up GHCR intermediate versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
          validate: true

  # scripts/release.py advances an SDK's version only when that SDK actually
  # has changes to publish, so "version unchanged since the previous release
  # tag" means "this version was already published" — the publish jobs below
  # are skipped for those, emitting no empty npm/crates.io releases.
  sdk-versions:
    name: Detect SDK publishes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.versions.outputs.rust }}
      node: ${{ steps.versions.outputs.node }}
      web: ${{ steps.versions.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare SDK versions with the previous release
        id: versions
        run: |
          current="${GITHUB_REF_NAME}"
          # Highest previous release tag reachable from the release commit's
          # parent; this release's own tag points at the release commit and is
          # therefore excluded by --merged.
          prev=$(git tag --merged "${current}^" --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "Previous release tag: ${prev:-<none, first release>}"

          cargo_toml_version() {
            sed -n 's/^version = "\([^"]*\)".*/\1/p' | head -n1
          }
          package_json_version() {
            grep -m1 '"version":' | sed -E 's/.*"version": *"([^"]+)".*/\1/'
          }

          # changed = the SDK's version in this release differs from the
          # previous release tag. No previous tag or missing file => changed.
          sdk_changed() {
            path="$1"; extractor="$2"
            cur=$("$extractor" < "$path")
            if [ -z "$prev" ] || ! git cat-file -e "${prev}:${path}" 2>/dev/null; then
              echo changed; return
            fi
            old=$(git show "${prev}:${path}" | "$extractor")
            if [ "$cur" = "$old" ]; then echo unchanged; else echo changed; fi
          }

          {
            echo "rust=$(sdk_changed sdk/rust/Cargo.toml cargo_toml_version)"
            echo "node=$(sdk_changed sdk/node/package.json package_json_version)"
            echo "web=$(sdk_changed sdk/web/package.json package_json_version)"
          } >> "$GITHUB_OUTPUT"

  publish-rust-sdk:
    name: Publish Rust SDK
    needs: [merge, sdk-versions]
    if: needs.sdk-versions.outputs.rust == 'changed'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-sdk.yml
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish-node-sdk:
    name: Publish Node SDK
    needs: [merge, sdk-versions]
    if: needs.sdk-versions.outputs.node == 'changed'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-node-sdk.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-web-sdk:
    name: Publish Web SDK
    needs: [merge, sdk-versions]
    if: needs.sdk-versions.outputs.web == 'changed'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-web-sdk.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs:
      - publish-rust-sdk
      - publish-node-sdk
      - publish-web-sdk
    # !failure() keeps "no release when a publish failed"; !cancelled() lets
    # this run when publish jobs were skipped (SDKs without changes).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
