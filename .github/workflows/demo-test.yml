name: Demo E2E Tests

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  demo-e2e:
    name: Demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Install Playwright browsers
        working-directory: demo
        run: npx playwright install --with-deps chromium

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.96.1"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Generate API client
        working-directory: frontend
        run: npm run generate-api

      # The browser SDK is a file: dependency of the frontend; dist/ is
      # gitignored and only exists after a build, and the vite dev server
      # started below needs it to resolve herald-auth-web imports.
      - name: Build browser SDK
        working-directory: sdk/web
        run: |
          npm ci --legacy-peer-deps
          npm run generate-api
          npm run build

      - name: Start demo environment
        run: python scripts/demo-start.py --timeout 300

      - name: Run demo tests
        working-directory: demo
        run: |
          TEST_FILES=$(find e2e -name '*.e2e.ts' -not -path '*/live/*' | sort | tr '\n' ' ')
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/results.json \
            npx playwright test $TEST_FILES --project=demo-fast --max-failures=0 --reporter=list,json
        continue-on-error: true

      - name: Failure summary
        if: always()
        run: python scripts/demo-failure-summary.py demo/test-results/results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-test-results
          path: |
            demo/test-results/
            log/
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: always()
        run: python scripts/demo-failure-summary.py demo/test-results/results.json --check-only

      - name: Stop demo environment
        if: always()
        run: python scripts/demo-stop.py
