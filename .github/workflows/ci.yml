name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop-*'
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # The Rust SDK is a standalone crate outside backend/'s Cargo
              # workspace; its lint job rides along with backend-ci.
              - 'sdk/rust/**'
            frontend:
              - 'frontend/**'
              # The browser SDK is a file: dependency of the frontend; SDK
              # changes must run the frontend checks (type-check first).
              - 'sdk/web/**'
            demo:
              - 'demo/**'

  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      SCCACHE_DISABLE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> target
            sdk/rust -> target

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

      - name: Check formatting (Rust SDK)
        working-directory: sdk/rust
        run: cargo fmt --all -- --check

      - name: Run clippy (Rust SDK)
        working-directory: sdk/rust
        run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

  frontend-ci:
    name: Frontend CI
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.96.1"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Generate API client
        working-directory: frontend
        run: npm run generate-api

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Test
        working-directory: frontend
        run: npm run test:run

  demo-ci:
    name: Demo CI
    needs: detect-changes
    if: needs.detect-changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo/package-lock.json

      - name: Install dependencies
        working-directory: demo
        run: npm ci

      - name: Lint
        working-directory: demo
        run: npm run lint

      - name: Type check
        working-directory: demo
        run: npm run type-check
