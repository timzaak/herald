name: Publish SDK

# Publishes the Rust `herald-sdk` crate (sdk/rust/) to crates.io. Called by the
# CD pipeline and available manually (workflow_dispatch). Version comes from
# sdk/rust/Cargo.toml (standalone crate, kept in sync with the main project by
# scripts/release.py). Select the release tag when running this workflow
# manually.
on:
  workflow_call:
    secrets:
      CRATES_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  publish-sdk:
    name: Publish herald-sdk to crates.io
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      SCCACHE_DISABLE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.96.1"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target

      - name: Publish herald-sdk
        working-directory: sdk/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
