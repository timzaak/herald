name: Publish SDK

# Publishes the Rust `herald-sdk` crate (sdk/rust/) to crates.io. Manual only
# (workflow_dispatch). Version comes from sdk/rust/Cargo.toml (standalone
# crate, kept in sync with the main project by scripts/release.py); commit any
# pending bump, then run this workflow.
on:
  workflow_dispatch:
    inputs:
      sdk-version:
        description: 'SDK version to publish (e.g. v0.1.0, or leave empty to use HEAD)'
        required: false
        type: string

jobs:
  publish-sdk:
    name: Publish herald-sdk to crates.io
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
      SCCACHE_DISABLE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.96.1"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust -> target

      - name: Publish herald-sdk
        working-directory: sdk/rust
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
