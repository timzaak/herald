[workspace]
resolver = "3"
members = [
    "entity",
    "domain",
    "infra",
    "infra-creem",
    "infra-iap",
    "infra-stripe",
    "infra-wechatpay",
    "core",
    "api-base",
    "api-billing",
    "api-admin",
    "api-auth",
    "api-ext",
    "api-mcp",
    "api-oauth",
    "api-points",
    "api",
    "worker",
    "app",
    "test-db",
    "test-support",
    "integration-tests",
]

[workspace.package]
#name = "herald"
version = "0.5.2"
authors = ["Timzaak <zsy.evan@gmail.com>"]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-valid = { version = "0.24" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "request-id"] }
hyper = { version = "1.5", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"

# Database
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres", "uuid", "migrate"] }

# Authentication & Encryption
bcrypt = "0.17"
hmac = "0.12"
sha2 = "0.10"

# Time & ID
chrono = { version = "0.4", features = ["serde"] }
# ⚠️ UUID v7 ONLY: We use UUID v7 for better database index locality and performance
# v7 is time-ordered and monotonic, unlike v4 which is random
uuid = { version = "1.19", features = ["v4", "v7", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# `log` facade: consumed directly by sea-orm ConnectOptions slow-statement API.
log = "0.4"

# OpenTelemetry observability (pinned combo).
# Lockstep note: tower-otel-http-metrics 0.16.0 depends on opentelemetry 0.30,
# so the whole OTel stack is pinned to the 0.30 line (not 0.32) to keep the
# RED metrics middleware library usable. tracing-opentelemetry 0.31 pairs with
# opentelemetry 0.30 (tracing-opentelemetry leads opentelemetry by one version).
# Do NOT bump any single crate here without re-running cargo check for the whole set.
opentelemetry = "0.30.0"
opentelemetry_sdk = { version = "0.30.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30.0", default-features = false, features = ["http-proto", "reqwest-rustls-webpki-roots", "metrics", "trace"] }
tracing-opentelemetry = "0.31.0"
tower-otel-http-metrics = { version = "0.16.0", features = ["axum"] }

# Configuration
toml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"

# API Documentation
utoipa = { version = "5.4", features = ["axum_extras", "uuid", "chrono", "openapi_extensions"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# Validation
validator = { version = "0.20", features = ["derive"] }
idna = "1.1"

# External Services
redis = { version = "1.0.1", features = ["connection-manager", "tokio-rustls-comp", "aio"] }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }

# OAuth
oauth2 = "5"
# ⚠️ DO NOT RE-ADD async-trait: We use native async fn in traits instead (Rust 1.75+)
# async-trait = "0.1"
base64 = "0.22"
jsonwebtoken = "9.3"

# Networking
ipnetwork = "0.21"

# Testing
test-context = "0.5.4"
tempfile = "3"
mockito = "1.2"
wiremock = "0.6"

# In-memory caching
moka = { version = "0.12", features = ["future"] }
once_cell = "1.20"

# Async utilities
dashmap = "6.1"
mockall = "0.14"

# Random
rand = "0.8"

# URL encoding
urlencoding = "2.1"

# TOTP
totp-lite = "2.0"
aes-gcm = "0.10"
base32 = "0.5"
hex = "0.4"

# WebAuthn / Passkey — pure-Rust server-side verification (no openssl).
# webauthn-rs 0.5 hard-depends on openssl via webauthn-rs-core; passkey-auth
# uses RustCrypto (p256 / ed25519-dalek / sha2) end-to-end.
passkey-auth = "0.1"

# App Store Server API + JWS/x5c verification (ES256 + Apple Root CA self-managed).
# RustCrypto p256, MIT, no openssl.
# `api-client-reqwest` enables the App Store Server API client + reqwest transport.
# `ocsp` is intentionally NOT enabled — verification is offline (trust anchor self-managed).
app-store-server-library = { version = "4.3", features = ["api-client-reqwest"] }

# `http` types are surfaced by the app-store-server-library Transport trait.
http = "1.4"

# LDAP client (enterprise directory login). default-features off to avoid
# the `tls` feature (= native-tls); rustls/ring backend matches the existing
# rustls 0.23 + ring tree (decision DEC-support-ldap-004).
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# Direct rustls access for the LDAP adapter's extra-CA injection; feature set
# mirrors ldap3's own rustls dependency (no aws-lc-rs) so the tree stays unified.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"

# MCP official Rust SDK: locked to the 3.1 minor line (3.2+ exists; the
# integration surface is narrow — single transport + tool macros — and minor
# releases have already renamed config types, so keep upgrades deliberate).
rmcp = { version = "~3.1", features = ["schemars", "transport-streamable-http-server"] }

# URL parsing
url = "2.5"

# Async utilities
futures = "0.3"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
