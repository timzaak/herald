[package]
name = "herald-domain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
bcrypt = { workspace = true }
totp-lite = { workspace = true }
passkey-auth = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
base32 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
mockall = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono"] }
validator = { workspace = true, features = ["derive"] }
idna = { workspace = true }
oauth2 = { workspace = true }
# Heavy deps for CoreError From impls (no proc-macro usage in domain)
sea-orm = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
# Shared external-HTTP span + duration histogram helper. Version pinned
# by backend/Cargo.toml workspace.dependencies.
opentelemetry = { workspace = true }

[dev-dependencies]
# Tests capture span fields via a JSON fmt layer (same pattern as the
# request_id span tests in `herald-api::observability::metrics_extractor`).
tracing-subscriber = { workspace = true }
