# Herald — production config for docker-compose deployment.
#
# Mounted into the herald container at /app/config.toml:ro (see docker-compose.yml).
# The image already bundles backend/config/production.toml with sensible defaults
# and DB/Redis hostnames `db`/`redis`; this file overrides only the values that
# MUST be set per deployment: secrets and your public origin.
#
# BEFORE first boot:
#   1. Generate jwt secret:        openssl rand -base64 48
#   2. Generate custom_domain key: openssl rand -hex 32
#   3. Put both below (never commit real secrets).
#   4. Set [frontend] url to your real public origin (used for CORS allowlist).

[database]
# Matches the `db` service in docker-compose.yml.
url = "postgresql://herald:herald@db:5432/herald"
max_connections = 50

[redis]
# Matches the `redis` service in docker-compose.yml.
url = "redis://redis:6379"

[server]
bind_address = "0.0.0.0:3000"
log_level = "info"
app_env = "production"
# Trusted reverse-proxy CIDRs. When the connection's socket peer falls in one
# of these, forwarded IP headers are trusted; otherwise they are IGNORED and
# the socket peer IP is used (drives audit logs + rate limiting). Empty
# (default) = trust nothing, correct when Herald is exposed directly.
#
# This also gates custom-domain cname/tls status advancement: a realm's
# cname_verified/tls_ready only flips when an HTTPS request arrives through a
# peer listed here. If your TLS-terminating ingress is NOT in this list,
# tenant custom domains stall at "pending verification" forever with no error
# — add the ingress CIDR here.
#
# Behind Cloudflare (orange cloud): set this to the CF IP ranges
# (https://www.cloudflare.com/ips/) and set real_ip_header = "CF-Connecting-IP"
# below. Invalid CIDR aborts startup (fail loud).
trusted_proxies = []
# Which header a trusted proxy writes the real client IP into:
#   "X-Forwarded-For" (default) → rightmost-untrusted chain algorithm
#   "CF-Connecting-IP"          → single value (Cloudflare)
#   "X-Real-IP"                 → single value (nginx/traefik)
real_ip_header = "X-Forwarded-For"

[frontend]
# CORS allowlist origin. Change to your real domain, e.g. "https://app.example.com".
url = "http://localhost:3000"
# Bundled inside the image; do not change.
static_dir = "/app/frontend/dist"

[jwt]
# REQUIRED. Generate with: openssl rand -base64 48
secret = "change-me-to-a-secure-random-base64-string"

# REQUIRED (startup guard at backend/api/src/lib.rs:164 rejects placeholder).
# The image bundles "change-me-in-production" here; overwrite with a high-entropy
# value. Generate with: openssl rand -hex 32
[custom_domain]
ask_key = "change-me-in-production"
# Hostname tenants CNAME their custom login domain to. Use a Herald-owned host.
cname_target = "custom.example.com"
